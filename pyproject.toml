[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracast"
version = "0.4.0"
description = "Traffic-speed forecasting on METR-LA: shared-weight and diffusion GRUs, conformal intervals, drift, and federated graph learning on a CPU"
readme = "README.md"
license = {text = "MIT"}
keywords = ["traffic forecasting", "METR-LA", "graph neural networks", "federated learning", "conformal prediction"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "tables==3.10.1", "matplotlib==3.9.2", "torch==2.5.1"]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
federated = ["flwr[simulation]==1.42.0"]
dev = ["ruff==0.17.3"]

[project.urls]
Repository = "https://github.com/ivanimmanuel-dev/TraCast"
Documentation = "https://github.com/ivanimmanuel-dev/TraCast/blob/main/docs/reproducibility.md"

[project.scripts]
tracast = "tracast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
extend-exclude = ["runs", "data", ".venv"]

[tool.ruff.lint]
# just the basics: syntax errors, undefined or unused names
select = ["E4", "E7", "E9", "F"]

[tool.flwr.app]
publisher = "ivanimmanuel-dev"

[tool.flwr.app.components]
serverapp = "tracast.flower_server:app"
clientapp = "tracast.flower_client:app"

[tool.flwr.app.config]
job-dir = "runs/federated-cli"
