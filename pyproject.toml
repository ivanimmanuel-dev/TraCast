[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficmind"
version = "0.1.0"
description = "CPU traffic-speed forecasting on METR-LA"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "tables==3.10.1", "matplotlib==3.9.2", "torch==2.5.1"]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
trafficmind = "trafficmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
