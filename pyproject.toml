[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracast"
version = "0.3.0"
description = "CPU traffic-speed forecasting on METR-LA"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "tables==3.10.1", "matplotlib==3.9.2", "torch==2.5.1"]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
federated = ["flwr[simulation]==1.42.0"]

[project.scripts]
tracast = "tracast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flwr.app]
publisher = "ivanimmanuel-dev"

[tool.flwr.app.components]
serverapp = "tracast.flower_server:app"
clientapp = "tracast.flower_client:app"

[tool.flwr.app.config]
job-dir = "runs/federated-cli"
