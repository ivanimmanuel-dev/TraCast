name: Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', 'configs/**', 'pyproject.toml', 'requirements-lock.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', 'configs/**', 'pyproject.toml', 'requirements-lock.txt', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      FLWR_TELEMETRY_ENABLED: '0'
      RAY_USAGE_STATS_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: python -W error -m compileall -q -f src tests tools
      - run: python -m pytest -q -W error
